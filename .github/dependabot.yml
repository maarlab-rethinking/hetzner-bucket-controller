# The safety net for what ages after publishing. Go itself is not here: the docker
# ecosystem bumps the golang image the release is built with, and CI follows the newest
# patch release of GO_VERSION (see the workflows).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      aws:
        patterns: ["github.com/aws/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
