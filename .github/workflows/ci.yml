name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The newest patch release of this Go minor, not the go directive in go.mod: that one is
# the minimum the module builds with, and nothing bumps it when a patch release fixes the
# standard library. Raise the minor here when the Dockerfile moves to the next one.
env:
  GO_VERSION: "1.27"

jobs:
  test:
    name: build & test (unit + envtest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./... && go vet -tags integration ./...
      - name: build
        run: go build ./...
      - name: test
        run: make test

  integration:
    name: integration (MinIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: test against MinIO
        run: make test-integration

  generated:
    name: generated files up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - name: regenerate deepcopy + CRD + RBAC + API reference
        run: make generate manifests api-docs
      - name: check for drift
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Generated files are stale. Run 'make generate manifests api-docs' and commit the result."
            exit 1
          fi

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  helm:
    name: helm lint & template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: lint & template
        run: make helm-lint

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: hetzner-bucket-controller:ci
