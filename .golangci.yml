version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    - errorlint
    - misspell
    - unconvert
    - unparam
  exclusions:
    generated: strict
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/maarlab-rethinking/hetzner-bucket-controller
