{{- /* Generated from +kubebuilder:rbac markers by "make manifests"; do not edit. */ -}}
{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hetzner-bucket-controller.fullname" . }}
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - objectstorage.maarlab.dev
  resources:
  - buckets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - objectstorage.maarlab.dev
  resources:
  - buckets/status
  verbs:
  - get
  - patch
  - update
{{- end }}
