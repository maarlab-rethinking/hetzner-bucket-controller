{{- if .Values.rbac.create }}
# Leader election only; it needs no cluster scope.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hetzner-bucket-controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hetzner-bucket-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
{{- end }}
