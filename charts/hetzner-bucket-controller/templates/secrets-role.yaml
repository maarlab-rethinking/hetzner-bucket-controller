{{- if .Values.rbac.create }}
{{- range .Values.rbac.secretNamespaces | default (list .Release.Namespace) }}
---
# Credentials Secrets are read only in the namespaces listed in rbac.secretNamespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hetzner-bucket-controller.fullname" $ }}-secrets
  namespace: {{ . }}
  labels:
    {{- include "hetzner-bucket-controller.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
{{- end }}
{{- end }}
