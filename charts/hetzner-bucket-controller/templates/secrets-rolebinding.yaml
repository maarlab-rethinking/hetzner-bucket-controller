{{- if .Values.rbac.create }}
{{- range .Values.rbac.secretNamespaces | default (list .Release.Namespace) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hetzner-bucket-controller.fullname" $ }}-secrets
  namespace: {{ . }}
  labels:
    {{- include "hetzner-bucket-controller.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hetzner-bucket-controller.fullname" $ }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "hetzner-bucket-controller.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
