# The S3 credential of the Hetzner project the bucket lives in, materialised by External
# Secrets from OpenBao. Hetzner has no API to create one: generate it in the Hetzner
# Console and seed it in OpenBao. access-key and secret-key are the controller's default
# keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-storage-management-backups
  namespace: backup-buckets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: object-storage-management-backups
    creationPolicy: Owner
  data:
    - secretKey: access-key
      remoteRef:
        key: platform/hetzner/management-backups/object-storage
        property: access-key
    - secretKey: secret-key
      remoteRef:
        key: platform/hetzner/management-backups/object-storage
        property: secret-key
